name: Waterflow validation

on:
  push:
    branches:
      - main
      - feature/3d-flood-lab-v0.1
      - feature/cinematic-flow-tracker-v0.2
      - feature/integrate-gpu-hydraulic-studio-v0.3
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Syntax-check frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/simulation-worker.js
          node --check web/flow-tracker.js
          node --check web/movie.js
          node tests/flow-tracker-test.cjs
          node tests/worker-test.cjs
      - name: Check required project files
        run: |
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f VERSION
          test -f planning/sprints/sprint-001/acceptance-criteria.md


  gpu-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json
      - name: Install GPU Studio dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint GPU Studio
        run: npm run lint
      - name: Run GPU Studio's hydraulic and UI unit tests
        run: npm test
      - name: Build GPU Studio for /studio/
        run: npm run build
      - name: Verify production entry and bundled assets
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q './assets/' dist/index.html


  integration-smoke:
    runs-on: ubuntu-latest
    needs: [validate, gpu-studio]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the combined container
        run: docker compose up -d --build
      - name: Test both HTTP applications and bundled studio script
        run: |
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8086/api/health > /tmp/waterflow-health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/waterflow-health.json
          curl -fsS http://127.0.0.1:8086/ > /tmp/waterflow-classic.html
          grep -q 'id="map"' /tmp/waterflow-classic.html
          curl -fsS http://127.0.0.1:8086/studio/ > /tmp/waterflow-studio.html
          grep -q 'id="viewport"' /tmp/waterflow-studio.html
          grep -q './assets/' /tmp/waterflow-studio.html
          ASSET=$(grep -oE '\./assets/[^"]+\.js' /tmp/waterflow-studio.html | head -1)
          test -n "$ASSET"
          ASSET_PATH=$(printf '%s' "$ASSET" | sed 's#^\./##')
          curl -fsS "http://127.0.0.1:8086/studio/$ASSET_PATH" -o /dev/null
      - name: Show startup logs when unhealthy
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop test deployment
        if: always()
        run: docker compose down --remove-orphans
