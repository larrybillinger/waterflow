name: Waterflow validation

on:
  push:
    branches:
      - main
      - feature/3d-flood-lab-v0.1
      - feature/cinematic-flow-tracker-v0.2
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Syntax-check frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/simulation-worker.js
          node --check web/flow-tracker.js
          node --check web/movie.js
          node tests/flow-tracker-test.cjs
          node tests/worker-test.cjs
      - name: Check required project files
        run: |
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f VERSION
          test -f planning/sprints/sprint-001/acceptance-criteria.md
