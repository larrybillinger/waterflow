<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Waterflow — dam failure flood simulator</title>
    <meta
      name="description"
      content="Browser-based dam failure flood simulator. Public elevation data, a published 2D hydraulic model on the GPU, and an explorable 3D view."
    />
    <meta name="theme-color" content="#0a1018" />
  </head>

  <body>
    <!-- The canvas owns the whole viewport. Everything else floats over it. -->
    <canvas id="viewport"></canvas>

    <div id="loading">
      <div class="inner">
        <h1>Waterflow</h1>
        <p class="tagline">
          Dam failure flood simulation from public elevation data, solved on the GPU and
          rendered as somewhere you can fly around.
        </p>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="step">Starting</div>
        <div class="error" style="display: none"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
