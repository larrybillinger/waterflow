services:
  waterflow:
    build: .
    image: waterflow:0.2.0
    ports:
      - "127.0.0.1:8086:8086"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
